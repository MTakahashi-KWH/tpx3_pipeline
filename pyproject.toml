[project]
authors = [{name = "Rhys Takahashi", email = "19mt01@gmail.com"}]
dependencies = [
    "numpy >=2.4.3,<3",
    "pyarrow >=24.0.0,<25",
    "tpx3awkward @ git+https://github.com/NSLS2/tpx3awkward.git",
    "softioc >=4.7.0, <5",
    "cothread >=2.20.1, <3",
]
name = "tpx3_pipeline"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tpx3_pipeline = { path = ".", editable = true }

[tool.pixi.tasks]
